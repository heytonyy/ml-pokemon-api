services:
  pokemon-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    volumes:
      # Mount models directory to persist model files
      - ./models:/app/models
    environment:
      - PORT=5050
      - MODEL_PATH=/app/models/pokemon_v1.pth
      - CLASS_MAPPING_PATH=/app/models/class_mapping.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

